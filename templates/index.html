<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TMMCH Virtual Assistant</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-badge">T</div>
        <div class="brand-text">
          <h1>TMMCH Virtual Assistant</h1>
          <p>Tairunnessa Memorial Medical College &amp; Hospital</p>
        </div>
      </div>
      <div class="topbar-right">
        <span class="status"><span class="status-dot"></span>Online</span>
        <button id="reset-btn" class="icon-btn" type="button" title="Start a new conversation">&#8634;</button>
      </div>
    </header>

    <main class="chat">
      <div id="messages" class="messages"></div>

      <div id="typing" class="typing" aria-label="Assistant is typing">
        <div class="avatar" aria-hidden="true">T</div>
        <div class="bubble"><i></i><i></i><i></i></div>
      </div>

      <form id="chat-form" class="chat-form" autocomplete="off">
        <input
          id="chat-input"
          type="text"
          placeholder="Ask about admissions, departments, services…"
          maxlength="1000"
          required
        >
        <button id="send-btn" type="submit" aria-label="Send message">&#10148;</button>
      </form>

      <footer class="chat-footer">Tairunnessa Memorial Medical College &amp; Hospital &mdash; Virtual Assistant</footer>
    </main>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
